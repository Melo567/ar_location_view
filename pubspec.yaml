name: ar_location_view
description: >-
  Location-based augmented reality: shows labels for geolocated points of
  interest over the camera preview, stacked so that every POI stays visible.
version: 3.2.1
homepage: https://github.com/Melo567/ar_location_view
repository: https://github.com/Melo567/ar_location_view
issue_tracker: https://github.com/Melo567/ar_location_view/issues
topics:
  - augmented-reality
  - ar
  - geolocation
  - camera
  - compass

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  sensors_plus: ^7.0.0
  camera: ^0.12.0
  # 13 requires apps to compile against Android SDK 37: allow both.
  permission_handler: '>=12.0.1 <14.0.0'
  vector_math: ^2.1.4
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  permission_handler_platform_interface: ^4.3.0
  camera_platform_interface: ^2.12.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pie.technology.ar.location.view.ar_location_view
        pluginClass: ArLocationViewPlugin
      ios:
        pluginClass: ArLocationViewPlugin
