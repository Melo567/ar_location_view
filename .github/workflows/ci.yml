name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart pub publish --dry-run

  pana:
    name: Package score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate pana
      # Fails when more than 20 points are lost.
      - run: dart pub global run pana --no-warning --exit-code-threshold 20 .

  build-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example
      - name: Native unit tests (JUnit)
        run: ./gradlew :ar_location_view:testDebugUnitTest
        working-directory: example/android

  build-ios:
    name: Build example (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --simulator --debug
        working-directory: example
      - name: Native unit tests (XCTest)
        working-directory: example/ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]+' | sed 's/ *$//')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:RunnerTests
